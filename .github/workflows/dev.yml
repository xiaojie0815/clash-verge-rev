name: Development Test

on:
  workflow_dispatch:
    inputs:
      run_windows:
        description: '运行 Windows'
        required: false
        type: boolean
        default: true
      run_macos_aarch64:
        description: '运行 macOS aarch64'
        required: false
        type: boolean
        default: true
      run_windows_arm64:
        description: '运行 Windows ARM64'
        required: false
        type: boolean
        default: true
      run_linux_amd64:
        description: '运行 Linux amd64'
        required: false
        type: boolean
        default: true

permissions: write-all
env:
  TAG_NAME: deploytest
  TAG_CHANNEL: DeployTest
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  HUSKY: 0
concurrency:
  group: '${{ github.workflow }} - ${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  select-targets:
    name: Select requested platforms
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          SELECT_WINDOWS: ${{ github.event.inputs.run_windows }}
          SELECT_MACOS: ${{ github.event.inputs.run_macos_aarch64 }}
          SELECT_WINDOWS_ARM64: ${{ github.event.inputs.run_windows_arm64 }}
          SELECT_LINUX: ${{ github.event.inputs.run_linux_amd64 }}
        run: |
          python3 - <<'PY'
          import json
          import os
          targets = [
              ('SELECT_WINDOWS', 'windows-latest', 'x86_64-pc-windows-msvc', 'nsis', 'windows', 'run_windows'),
              ('SELECT_MACOS', 'macos-latest', 'aarch64-apple-darwin', 'dmg', 'macos-aarch64', 'run_macos_aarch64'),
              ('SELECT_WINDOWS_ARM64', 'windows-latest', 'aarch64-pc-windows-msvc', 'nsis', 'windows-arm64', 'run_windows_arm64'),
              ('SELECT_LINUX', 'ubuntu-22.04', 'x86_64-unknown-linux-gnu', 'deb', 'linux-amd64', 'run_linux_amd64'),
          ]
          selected = [dict(os=runner, target=target, bundle=bundle, id=name, input=key)
                      for flag, runner, target, bundle, name, key in targets
                      if os.environ.get(flag, '').lower() == 'true']
          if not selected:
              raise SystemExit('Select at least one build platform.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps({'include': selected}) + '\n')
          PY

  dev:
    name: Build ${{ matrix.id }}
    needs: select-targets
    if: needs.select-targets.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-targets.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip job if not selected
        if: github.event.inputs[matrix.input] != 'true'
        run: echo "Job ${{ matrix.id }} skipped as requested"

      - name: Checkout Repository
        if: github.event.inputs[matrix.input] == 'true'
        uses: actions/checkout@v7

      - name: Install Rust Stable
        if: github.event.inputs[matrix.input] == 'true'
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Rust Cache
        if: github.event.inputs[matrix.input] == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          prefix-key: 'v1-rust'
          key: 'rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04' && github.event.inputs[matrix.input] == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        if: github.event.inputs[matrix.input] == 'true'
        with:
          run_install: false

      - name: Install Node
        if: github.event.inputs[matrix.input] == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: 'pnpm'

      - name: Pnpm install and check
        if: github.event.inputs[matrix.input] == 'true'
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Release ${{ env.TAG_CHANNEL }} Version
        if: github.event.inputs[matrix.input] == 'true'
        run: pnpm release-version ${{ env.TAG_NAME }}

      - name: Add Rust Target
        if: github.event.inputs[matrix.input] == 'true'
        run: |
          # Ensure cross target is installed for the pinned toolchain; fallback without explicit toolchain if needed
          rustup target add ${{ matrix.target }} --toolchain 1.99.0 || rustup target add ${{ matrix.target }}
          rustup target list --installed
          echo "Rust target ${{ matrix.target }} installed."

      - name: Tauri build
        if: github.event.inputs[matrix.input] == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }} -b ${{ matrix.bundle }}

      - name: Verify private diagnostic MCP
        if: matrix.os == 'ubuntu-22.04' && github.event.inputs[matrix.input] == 'true'
        run: cargo test -p clash-verge --lib --target ${{ matrix.target }} diagnostic_mcp -- --nocapture

      - name: Upload Artifacts (macOS)
        if: matrix.os == 'macos-latest' && github.event.inputs[matrix.input] == 'true'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Artifacts (Windows)
        if: matrix.os == 'windows-latest' && github.event.inputs[matrix.input] == 'true'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Artifacts (Linux)
        if: matrix.os == 'ubuntu-22.04' && github.event.inputs[matrix.input] == 'true'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: target/${{ matrix.target }}/release/bundle/deb/*.deb
          if-no-files-found: error
